<div class="container animate-fade-in setup-container">
<div class="list-container animate-fade-in">
  <div class="page-header">
    <div class="title-section">
      <h1>{{ config.title | translate }}</h1>
      <p>{{ config.subtitle | translate }}</p>
    </div>
    <div class="action-section">
      <button class="btn btn-secondary" [routerLink]="config.backRoute">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        {{ 'trash.backToList' | translate }}
      </button>
    </div>
  </div>

  <div class="card filter-card" style="margin-bottom: 24px;">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input
        type="text"
        [placeholder]="'trash.searchPlaceholder' | translate"
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
      >
    </div>
  </div>

  <div class="card table-card" style="padding: 0; overflow: hidden">
    <div *ngIf="isLoading" style="padding: 40px; text-align: center">
      <div class="spinner-blue" style="border-top-color: var(--primary); border-width: 4px; width: 40px; height: 40px; margin: 0 auto"></div>
      <p style="color: var(--text-muted); margin-top: 12px;">{{ 'common.loading' | translate }}</p>
    </div>
    <table *ngIf="!isLoading" class="data-table">
      <thead>
        <tr>
          <th *ngFor="let col of config.columns">{{ col.label | translate }}</th>
          <th class="text-right">{{ 'common.actions' | translate }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of filteredRows">
          <td *ngFor="let col of config.columns">
            <strong *ngIf="col.bold">{{ displayValue(row, col) }}</strong>
            <span *ngIf="!col.bold">{{ displayValue(row, col) }}</span>
          </td>
          <td class="text-right actions-cell">
            <button class="icon-btn restore" (click)="restoreRow(row)" [attr.title]="'common.restore' | translate">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="filteredRows.length === 0">
          <td [attr.colspan]="config.columns.length + 1" style="text-align: center; color: var(--text-muted); padding: 24px;">
            {{ 'trash.noRecords' | translate }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<style>
  .text-right { text-align: right; }
  .actions-cell { display: flex; justify-content: flex-end; gap: 8px; }
  .icon-btn.restore:hover { color: #059669; background: #ecfdf5; }
</style>
